name: Contribution snake

on:
  schedule:
    - cron: "0 4 * * *" # todo dia às 04:00 UTC
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F72585&color_dots=#EBEDF0,#E0AAFF,#C77DFF,#9D4EDD,#7B2CBF
            dist/snake-dark.svg?palette=github-dark&color_snake=#F72585&color_dots=#161B22,#3C096C,#7B2CBF,#C77DFF,#F72585

      # Publica os SVGs no branch "output", que o README referencia
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
